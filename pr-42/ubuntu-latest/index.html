reate the scratch data directories\n\n```bash\nrm -rf /tmp/lez-doctest-empty /tmp/lez-doctest-moved && mkdir -p lez-home/config lez-home/data && echo ok\n```"}, {"execs": [], "md": "## Step 3: First run: the create screen, and the two ways to get it wrong\n\nWith nothing saved, the app opens straight on the create screen. There is\nno notice banner \u2014 a genuine first run is not something the user needs to\nbe told about \u2014 and no file paths are requested anywhere on the page.\n\nThe password is validated in the view before any call is made, so both\nvalidation failures are visible without touching the backend."}, {"execs": [{"cmd": "XDG_CONFIG_HOME=$PWD/lez-home/config XDG_DATA_HOME=$PWD/lez-home/data nix run . --no-write-lock-file -- --height 1400\n\n# test actions:\n- The app opens on the create screen: wait for ['Create your LEZ Wallet', 'Create Wallet']\n- No file paths are requested to create a wallet: expect ['Choose a password and a network. Your wallet files are stored for you.']\n- An empty password is rejected: click 'Create Wallet'\n- The empty-password error is shown: wait for ['Password cannot be empty.']\n- Enter a password: set objectName='lezCreatePasswordField' to 'doctest-passphrase'\n- Enter a different confirmation: set objectName='lezCreateConfirmField' to 'not-the-same'\n- Mismatched passwords are rejected: click 'Create Wallet'\n- The mismatch error is shown: wait for ['Passwords do not match.']\n- Follow \"Open wallet instead\": click objectName='lezOpenInsteadLink'\n- The open screen asks for files, and for nothing else: wait for ['Open an existing wallet', 'Select the storage and config files of a wallet you already have.', 'Storage file', 'Config file']\n- Opening with nothing filled in is refused: click 'Open Wallet'\n- The missing-selection error is shown: wait for ['Select both a storage file and a config file.']\n- Point at a storage file that does not exist: set objectName='lezOpenStorageField' to '/tmp/lez-doctest-does-not-exist/storage.json'\n- Point at a config file that does not exist: set objectName='lezOpenConfigField' to '/tmp/lez-doctest-does-not-exist/config.json'\n- Try to open them: click 'Open Wallet'\n- The missing-file error names the path: wait for ['No config file at /tmp/lez-doctest-does-not-exist/config.json']\n- Go back to the create screen: click 'Back'\n- The create screen is showing again: wait for ['Create your LEZ Wallet']\n- Enter a password: set objectName='lezCreatePasswordField' to 'doctest-passphrase'\n- Enter a matching confirmation: set objectName='lezCreateConfirmField' to 'doctest-passphrase'\n- Create the wallet: click 'Create Wallet'\n- The recovery phrase is shown, exactly once: wait for ['Your recovery phrase', 'This is the only', 'I have saved it']\n- Acknowledge the phrase: click 'I have saved it'\n- The dashboard is reached: wait for ['Accounts']", "kind": "ui_test", "note": "app exited (code 1) before inspector opened on port 3768", "output": "path \"/tmp/doctest-test-quxv__ig\" does not contain a 'flake.nix', searching up\nerror: could not find a flake.nix file", "status": "fail"}], "md": "### 3.1 Launch on a clean profile and exercise the create-form validation\n\n```bash\nXDG_CONFIG_HOME=$PWD/lez-home/config XDG_DATA_HOME=$PWD/lez-home/data nix run . --no-write-lock-file -- --height 1400\n```\n\nFirst run: no saved wallet, so onboarding starts here.\n\n![The app opens on the create screen](images/onboarding-create-first-run.png)\n\n![The empty-password error is shown](images/onboarding-error-empty-password.png)\n\n![The mismatch error is shown](images/onboarding-error-password-mismatch.png)\n\nNo password field and no network selector: `wallet_ffi_open` takes\nno password, and the sequencer is read from the config file being\nopened. Asking for either would be asking for something the call\ndiscards.\n\n![The open screen asks for files, and for nothing else](images/onboarding-open-existing.png)\n\nNothing is created. A wrong path is an error the user can read and correct.\n\n![The missing-file error names the path](images/onboarding-error-missing-file.png)\n\n`create_new` returns the phrase and `lez_core` has no call to read\nit back, so this render is the only copy the user is ever offered.\nThe wallet is already open behind this page \u2014 the dashboard is\nheld back until the phrase is acknowledged.\n\n![The recovery phrase is shown, exactly once](images/onboarding-recovery-phrase.png)\n\n![The dashboard is reached](images/onboarding-dashboard.png)"}, {"execs": [], "md": "## Step 4: Returning user: the wallet opens without asking anything\n\nThe successful create saved its paths. On the next launch the backend finds\nthem, confirms both files are still on disk, and opens the wallet \u2014 so a\nreturning user reaches the dashboard without being asked anything.\n\nThe view shows a brief loading state first. It has to: whether there is a\nwallet to open is not known until the `lez_core` handshake settles, so\n\"no wallet open\" is an absence of information at that point rather than an\nanswer. Routing it to onboarding would flash the create screen on every\nlaunch and then replace it."}, {"execs": [{"cmd": "XDG_CONFIG_HOME=$PWD/lez-home/config XDG_DATA_HOME=$PWD/lez-home/data nix run . --no-write-lock-file -- --height 1400\n\n# test actions:\n- The dashboard opens directly, with no onboarding: wait for ['Accounts']", "kind": "ui_test", "note": "app exited (code 1) before inspector opened on port 3768", "output": "path \"/tmp/doctest-test-quxv__ig\" does not contain a 'flake.nix', searching up\nerror: could not find a flake.nix file", "status": "fail"}], "md": "### 4.1 Relaunch against the same profile\n\n```bash\nXDG_CONFIG_HOME=$PWD/lez-home/config XDG_DATA_HOME=$PWD/lez-home/data nix run . --no-write-lock-file -- --height 1400\n```\n\nNo password prompt: opening a wallet does not take one.\n\n![The dashboard opens directly, with no onboarding](images/onboarding-returning-user.png)"}, {"execs": [], "md": "## Step 5: The saved wallet disappears\n\nMoving or deleting the wallet folder is the case that used to strand\npeople: the saved paths stayed in `QSettings`, the open failed silently on\nevery launch, and the onboarding screen offered the dead paths back as a\nprefill.\n\nNow the backend checks the files exist before it tries to open them, tells\nthe user what happened, and forgets the paths \u2014 naming them in the notice,\nbecause clearing the settings destroys the only other record of where the\nwallet used to be."}, {"execs": [{"cmd": "mv \"$(dirname \"$(find lez-home/data -name storage.json -path '*lez_wallet*' | head -1)\")\" /tmp/lez-doctest-moved && echo moved", "exit_code": 1, "kind": "run", "note": "exit code 1", "output": "mv: cannot move '.' to '/tmp/lez-doctest-moved': Device or resource busy\n", "status": "fail"}], "md": "### 5.1 Move the wallet folder aside\n\n```bash\nmv \"$(dirname \"$(find lez-home/data -name storage.json -path '*lez_wallet*' | head -1)\")\" /tmp/lez-doctest-moved && echo moved\n```"}, {"execs": [{"cmd": "XDG_CONFIG_HOME=$PWD/lez-home/config XDG_DATA_HOME=$PWD/lez-home/data nix run . --no-write-lock-file -- --height 1400\n\n# test actions:\n- The user is told why they are back at onboarding: wait for ['Your saved wallet files were not found', 'Create your LEZ Wallet']\n- The notice can be dismissed: call 'lezNotice'.hide()\n- The notice is gone: expect objectName='lezNotice' .shown == False\n- Open the moved wallet from its new location: click objectName='lezOpenInsteadLink'\n- The open screen offers no stale prefill: expect objectName='lezOpenStorageField' .text == ''", "kind": "ui_test", "note": "app exited (code 1) before inspector opened on port 3768", "output": "path \"/tmp/doctest-test-quxv__ig\" does not contain a 'flake.nix', searching up\nerror: could not find a flake.nix file", "status": "fail"}], "md": "### 5.2 Relaunch and confirm the notice\n\n```bash\nXDG_CONFIG_HOME=$PWD/lez-home/config XDG_DATA_HOME=$PWD/lez-home/data nix run . --no-write-lock-file -- --height 1400\n```\n\nThe notice carries both paths, then the saved location is forgotten.\n\n![The user is told why they are back at onboarding](images/onboarding-notice-files-missing.png)\n\nThe forgotten paths are gone from the PROPs too, so they cannot be offered back."}, {"execs": [], "md": "## Step 6: Opening a wallet that exists but cannot be read\n\nTwo files that exist but are not a wallet are the exact shape of the\noriginal bug report: a user created empty `config.json` and `storage.json`\nby hand \u2014 the only way the old file picker would let them proceed \u2014 and the\napp answered by refusing to *load* a wallet they were trying to *create*.\n\nThe create path no longer depends on those files existing, and the open path\nnow reports the failure with the code the FFI actually returned."}, {"execs": [{"cmd": "mkdir -p /tmp/lez-doctest-empty && echo '{}' > /tmp/lez-doctest-empty/config.json && echo '{}' > /tmp/lez-doctest-empty/storage.json && echo ok", "exit_code": 0, "kind": "run", "note": "", "output": "ok\n", "status": "pass"}], "md": "### 6.1 Write two empty JSON files\n\n```bash\nmkdir -p /tmp/lez-doctest-empty && echo '{}' > /tmp/lez-doctest-empty/config.json && echo '{}' > /tmp/lez-doctest-empty/storage.json && echo ok\n```"}, {"execs": [{"cmd": "XDG_CONFIG_HOME=$PWD/lez-home/config XDG_DATA_HOME=$PWD/lez-home/data nix run . --no-write-lock-file -- --height 1400\n\n# test actions:\n- Onboarding is showing: wait for ['Create your LEZ Wallet']\n- Go to the open screen: click objectName='lezOpenInsteadLink'\n- Point at the empty storage file: set objectName='lezOpenStorageField' to '/tmp/lez-doctest-empty/storage.json'\n- Point at the empty config file: set objectName='lezOpenConfigField' to '/tmp/lez-doctest-empty/config.json'\n- Try to open them: click 'Open Wallet'\n- The failure is reported with the FFI error code: wait for ['Could not open the wallet at those paths']\n- Editing a path clears the stale error: set objectName='lezOpenStorageField' to '/tmp/lez-doctest-empty/storage2.json'\n- The error is gone: expect objectName='lezOpenError' .shown == False", "kind": "ui_test", "note": "app exited (code 1) before inspector opened on port 3768", "output": "path \"/tmp/doctest-test-quxv__ig\" does not contain a 'flake.nix', searching up\nerror: could not find a flake.nix file", "status": "fail"}], "md": "### 6.2 Try to open them\n\n```bash\nXDG_CONFIG_HOME=$PWD/lez-home/config XDG_DATA_HOME=$PWD/lez-home/data nix run . --no-write-lock-file -- --height 1400\n```\n\nThe user stays on the open screen with an error they can act on.\nNothing was created, and no config file was rewritten.\n\n![The failure is reported with the FFI error code](images/onboarding-error-unreadable-wallet.png)"}, {"execs": [], "md": "## Step 7: Reopening the moved wallet\n\nFinally, the path that proves the open branch really is an open: the wallet\nmoved aside earlier is loaded from its new location, with no password and no\nnetwork selection, and the dashboard comes back."}, {"execs": [{"cmd": "XDG_CONFIG_HOME=$PWD/lez-home/config XDG_DATA_HOME=$PWD/lez-home/data nix run . --no-write-lock-file -- --height 1400\n\n# test actions:\n- Onboarding is showing: wait for ['Create your LEZ Wallet']\n- Go to the open screen: click objectName='lezOpenInsteadLink'\n- Point at the moved storage file: set objectName='lezOpenStorageField' to '/tmp/lez-doctest-moved/storage.json'\n- Point at the moved config file: set objectName='lezOpenConfigField' to '/tmp/lez-doctest-moved/config.json'\n- Open it: click 'Open Wallet'\n- The dashboard is reached: wait for ['Accounts']", "kind": "ui_test", "note": "app exited (code 1) before inspector opened on port 3768", "output": "path \"/tmp/doctest-test-quxv__ig\" does not contain a 'flake.nix', searching up\nerror: could not find a flake.nix file", "status": "fail"}], "md": "### 7.1 Open the wallet from its new location\n\n```bash\nXDG_CONFIG_HOME=$PWD/lez-home/config XDG_DATA_HOME=$PWD/lez-home/data nix run . --no-write-lock-file -- --height 1400\n```\n\nSame wallet, new location, no recovery phrase shown \u2014 this was an open, not a create.\n\n![The dashboard is reached](images/onboarding-reopened.png)"}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
