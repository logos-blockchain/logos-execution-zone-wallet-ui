reate the scratch data directories\n\n```bash\nrm -rf /tmp/lez-doctest-empty /tmp/lez-doctest-moved && mkdir -p lez-home/config lez-home/data && echo ok\n```"}, {"execs": [], "md": "## Step 3: First run: the create screen, and the two ways to get it wrong\n\nWith nothing saved, the app opens straight on the create screen. There is\nno notice banner \u2014 a genuine first run is not something the user needs to\nbe told about \u2014 and no file paths are requested anywhere on the page.\n\nThe password is validated in the view before any call is made, so both\nvalidation failures are visible without touching the backend."}, {"execs": [{"cmd": "XDG_CONFIG_HOME=$PWD/lez-home/config XDG_DATA_HOME=$PWD/lez-home/data nix run github:logos-blockchain/logos-execution-zone-wallet-ui/1450005b55b2efe13571dcdeae4a85c4b735164e --no-write-lock-file -- --height 1400\n\n# test actions:\n- The app opens on the create screen: wait for ['Create your LEZ Wallet', 'Create Wallet']\n- Let the page transition settle: sleep 1500ms\n- No file paths are requested to create a wallet: expect ['Choose a password and a network. Your wallet files are stored for you.']\n- An empty password is rejected: click 'Create Wallet'\n- The empty-password error is shown: wait for ['Password cannot be empty.']\n- Enter a password: set objectName='lezCreatePasswordField' to 'doctest-passphrase'\n- Enter a different confirmation: set objectName='lezCreateConfirmField' to 'not-the-same'\n- Mismatched passwords are rejected: click 'Create Wallet'\n- The mismatch error is shown: wait for ['Passwords do not match.']\n- Follow \"Open wallet instead\": click objectName='lezOpenInsteadLink'\n- The open screen asks for files, and for nothing else: wait for ['Open an existing wallet', 'Select the storage and config files of a wallet you already have.', 'Storage file', 'Config file']\n- Let the page transition settle: sleep 1500ms\n- Opening with nothing filled in is refused: click 'Open Wallet'\n- The missing-selection er v4BO8Dg4nAAAAAElFTkSuQmCC)"}, {"execs": [], "md": "## Step 5: The saved wallet disappears\n\nMoving or deleting the wallet folder is the case that used to strand\npeople: the saved paths stayed in `QSettings`, the open failed silently on\nevery launch, and the onboarding screen offered the dead paths back as a\nprefill.\n\nNow the backend checks the files exist before it tries to open them, tells\nthe user what happened, and forgets the paths \u2014 naming them in the notice,\nbecause clearing the settings destroys the only other record of where the\nwallet used to be."}, {"execs": [{"cmd": "set -e\nd=\"$(dirname \"$(find lez-home/data -name storage.json | head -1)\")\"\ntest -f \"$d/storage.json\" || { echo \"no wallet was created under lez-home/data\"; exit 1; }\nmv \"$d\" /tmp/lez-doctest-moved\necho moved\n", "exit_code": 0, "kind": "run", "note": "", "output": "moved\n", "status": "pass"}], "md": "### 5.1 Move the wallet folder aside\n\n```bash\nset -e\nd=\"$(dirname \"$(find lez-home/data -name storage.json | head -1)\")\"\ntest -f \"$d/storage.json\" || { echo \"no wallet was created under lez-home/data\"; exit 1; }\nmv \"$d\" /tmp/lez-doctest-moved\necho moved\n\n```"}, {"execs": [{"cmd": "XDG_CONFIG_HOME=$PWD/lez-home/config XDG_DATA_HOME=$PWD/lez-home/data nix run github:logos-blockchain/logos-execution-zone-wallet-ui/1450005b55b2efe13571dcdeae4a85c4b735164e --no-write-lock-file -- --height 1400\n\n# test actions:\n- The user is told why they are back at onboarding: wait for ['Create your LEZ Wallet']\n- Let the page transition settle: sleep 1500ms\n- The notice is raised: expect objectName='lezNotice' .shown == True\n- The notice can be dismissed: call 'lezNotice'.hide()\n- The notice is gone: expect objectName='lezNotice' .shown == False\n- Open the moved wallet from its new location: click objectName='lezOpenInsteadLink'\n- Let the page transition settle: sleep 1500ms\n- The open screen offers no stale prefill: expect objectName='lezOpenStorageField' .text == ''", "kind": "ui_test", "note": "", "output": "\nRunning 1 test(s)...\n\n  \u001b[32m\u2713\u001b[0m LEZ Wallet onboarding: create, recover the phrase, reopen, and every way it can fail: Relaunch and confirm the notice\n\n1 passed, 0 failed\n\n", "status": "pass"}], "md": "### 5.2 Relaunch and confirm the notice\n\n```bash\nXDG_CONFIG_HOME=$PWD/lez-home/config XDG_DATA_HOME=$PWD/lez-home/data nix run github:logos-blockchain/logos-execution-zone-wallet-ui/1450005b55b2efe13571dcdeae4a85c4b735164e --no-write-lock-file -- --height 1400\n```\n\nThe notice carries both paths, then the saved location is forgotten.\n\n![The user is told why they are back at onboarding](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAV4CAIAAACxeTjMAAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdeVwV1eP/8TN34bIKIoiKG2KiuOSWuZBLJmpqKrlVmpaVaK4fsdXKT1lZqZVZqWkfNUvLNXPJfcUVxAUFRHJJBUU2AVnu9vtjvs3j/i6LqBh65/X8a2buzJkzl/Hhed8554zk5+cnAAAAAKiDpqIrAAAAAODfQwAAAAAAVIQAAAAAAKgIAQAAAABQEQIAAAAAoCIEAAAAAEBFCAAAAACAihAAAAAAABUhAAAAAAAqQgAAAAAAVIQAAAAAAKgIAQAAAABQEQIAAAAAoCIEAAAAAEBFCAAAAACAihAAAAAAABUhAAAAAAAqQgAAAAAAVIQAAAAAAKgIAQAAAABQEQIAAAAAoCIEAAAAAEBFCAAAAACAihAAAAAAABUhAAAAAAAqQgAAUIzBgwen/CMuLs72o1q1aqXYaNiwYUVVEgAA3AVdRVfg/qpateqAAQM6deoUFBTk7e1dWFiYkpISHx+/bt26rVu3FhYWVnQFcb94enomJCQoq+Hh4evWrbvtUTt27GjcuHEZT9GwYcPMzEx5+dtvv3322WfLXr3Lly+3bt266PZKlSqdOXNGp/u/f5j9+/c/ePCg3T5arTYuLq5SpUpCiBkzZnz11VdFy1m8eHGPHj2U5bfeeqvsdQMAAI7NYQOAXq+fOHHi66+/7uzsrGx0cnKqX79+/fr1e/fu/ffff//nP//Zt29fBVayLLy8vF555RV5+auvvjKZTBVbHyisVmu5l3nz5s2oqKi2bdvKq126dCkaAFq1aiW3/uUdigYAnU7XoUMHZXX79u3lXs/7oVevXo0aNRJCHDlyZO/evRVdHQAAHJZjdgFycXH5+eefJ0+ebNv6t1OrVq3ffvvt5Zdf/jcrdhdCQkIi/qHVaiu6OigfW7ZsKemjbdu2KctdunQpukPnzp2VZdswoGjdurWHh4e8XFBQsH///nup6r9mypQp8n3esWPHiq4LAACOzDGfAHz99dd2bYikpKT4+Hi9Xt+8efOqVavKGyVJmj59+tWrV//888+KqGaZtGvXrqKroFLJycnnzp0rZQej0agsx8bGenp6lrRnQEBAYGCgspqUlPTRRx+VtPOOHTvee+89eblJkyY+Pj43btyw3eHJJ59UlnU6XceOHTds2GC7g21siIyMzM/PL+UqHhCVK1cOCgqq6FoAAKAKDhgAevXq9cwzzyiraWlpr7/++u7du+VVnU4XHh4+d <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
