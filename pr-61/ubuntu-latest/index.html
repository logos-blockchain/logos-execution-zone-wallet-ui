  .exec:last-child { margin-bottom: 0; }

  .badge.fail { background: rgba(248,81,73,.15); color: var(--fail); }
  .badge.info { background: rgba(210,153,34,.15); color: var(--info); }
  .badge.not_run { background: var(--bg); color: var(--muted); white-space: nowrap; }
  .badge.running { background: rgba(248,81,73,.15); color: var(--fail); }

r both\nfiles happened to exist, so a mistyped filename silently became a request to\ncreate a new wallet, and the Browse buttons \u2014 which can only select files that\nalready exist \u2014 made the create path unreachable through the UI at all.\n\nEach section relaunches the app against the same isolated data directory, so\nthe returning-user and missing-files paths are exercised as real restarts\nrather than simulated ones.\n\n**What you'll build:** The LEZ wallet UI standalone app, launched headless against an isolated data directory and driven through the welcome screen, the setup wizard, and the create, recovery-phrase, reopen and open-existing flows.\n\n**What you'll learn:**\n\n- How the setup wizard separates wallet creation from opening an existing wallet, on its first step\n- Why the create path never asks the user for a file path\n- How the recovery phrase is surfaced exactly once, and why the dashboard is held back until it is acknowledged\n- How the app recovers when a previously saved wallet has been moved or deleted\n- What each onboarding failure looks like to the user\n\n## Prerequisites\n\n- **Nix** with flakes enabled. Install from [nixos.org](https://nixos.org/download.html), then enable flakes:\n\n```bash\nmkdir -p ~/.config/nix\necho 'experimental-features = nix-command flakes' >> ~/.config/nix/nix.conf\n```\n\nVerify: `nix flake --help >/dev/null 2>&1 && echo \"Flakes enabled\"`\n\n- **A Linux machine.** The app runs headless via `QT_QPA_PLATFORM=offscreen`, so\nno display is needed. Linux specifically, because the isolation below works by\npointing `XDG_CONFIG_HOME` and `XDG_DATA_HOME` at a scratch directory \u2014\n`QStandardPaths` honours those on Linux but not on macOS, where the run would\ntouch your real wallet data instead."}, {"execs": [], "md": "## Step 1: Build the qt-mcp test driver\n\n[`logos-qt-mcp`](https://github.com/logos-co/logos-qt-mcp) connects to the\napp's QML inspector and drives it. Build it once and link it as\n`./res pp opens on the welcome screen](images/onboarding-welcome-first-run.png)\n\nCreate and open differ in what they commit you to, not just in a\nvalue, so each gets a card with room to say what picking it means\nrather than a radio label.\n\n![The first step asks the only question that changes the route](images/onboarding-setup-step.png)\n\nThe common arrival here is someone with no wallet, so the create\nroute is preselected and the step is already satisfied \u2014 one\nclick on the footer, rather than a choice that has to be made\nbefore the wizard will move at all.\n\nNo password field and no network selector: `wallet_ffi_open` takes\nno password, and the sequencer is read from the config file being\nopened. Asking for either would be asking for something the call\ndiscards \u2014 which is also why this route ends the wizard here\ninstead of walking on through Network and Password.\n\n![The file pickers appear inline, and nothing else is asked for](images/onboarding-open-existing.png)\n\nThe old open screen accepted the click and answered with \"Select\nboth a storage file and a config file.\" The gate is the same\ncontract, moved: the button states its condition instead of\nwaiting to reject you.\n\nNothing is created. A wrong path is an error the user can read and correct.\n\n![The missing-file error names the path](images/onboarding-error-missing-file.png)\n\nIts own step because the answer is written into the wallet's\nconfig at creation \u2014 after this it is not a preference any more.\nThe field is pre-filled with the testnet preset, so the step is\nalready satisfied.\n\n![The network step asks for a sequencer](images/onboarding-network-step.png)\n\n![No file paths are requested to create a wallet](images/onboarding-password-step.png)\n\nThis step is validated on submit rather than gated, so the button\nstays live and answers with which of the two things is wrong.\n\n![The empty-password error is shown](images/onboarding-error-empty-password.png)\n\n![The mismatch error is shown](images/onboarding-error-password-mismatch.png)\n\n`create_new` returns the phrase and `lez_core` has no call to read\nit back, so this render is the only copy the user is ever offered.\nThe wallet is already open behind this page \u2014 the dashboard is\nheld back until the phrase is acknowledged, and this is the one\nstep with no Back button, because there is nothing behind it to\ngo back to.\n\n![The recovery phrase is shown, exactly once](images/onboarding-recovery-phrase.png)\n\n![The dashboard is reached](images/onboarding-dashboard.png)"}, {"execs": [], "md": "## Step 4: Returning user: the wallet opens without asking anything\n\nThe successful create saved its paths. On the next launch the backend finds\nthem, confirms both files are still on disk, and opens the wallet \u2014 so a\nreturning user reaches the dashboard without being asked anything, and\nnever sees the welcome screen.\n\nThe view shows a brief loading state first. It has to: whether there is a\nwallet to open is not known until the `lez_core` handshake settles, so\n\"no wallet open\" is an absence of information at that point rather than an\nanswer. Routing it to onboarding would flash the welcome screen on every\nlaunch and then replace it."}, {"execs": [{"actions": [{"description": "The dashboard opens directly, with no onboarding: wait for ['Accounts']", "index": 1, "status": "not_run"}], "cmd": "XDG_CONFIG_HOME=$PWD/lez-home/config XDG_DATA_HOME=$PWD/lez-home/data nix run github:logos-blockchain/logos-execution-zone-wallet-ui/9718dfa34df1913bc223091e9fba6999b0a78a99 --no-write-lock-file -- --height 1400 --user-dir $PWD/lez-home/data/basecamp", "kind": "ui_test", "note": "app exited (code 1) before inspector opened on port 3768", "output": "czdvrhawhbrm6iam5lwwr-source/src/LEZWalletBackend.h:73:36: note: ...following parameter 1 which has a default argument\n       >    73 |     void openIfPathsConfigured(int attempt = 0, const QString& password);\n       >       | <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    if (e.runner_cmd) h += `<pre class="cmd">${escapeHtml(e.runner_cmd)}</pre>`;
    if (e.actions) {
      const passed = e.actions.filter(a => a.status === "pass").length;
      h += `<div class="kind">UI actions: ${passed}/${e.actions.length} passed</div>`;
      h += `<table class="ui-actions"><tbody>`;
      for (const a of e.actions) {
        const label = a.status === "not_run" ? "NOT RUN" :
          a.status === "running" ? "INTERRUPTED" : a.status.toUpperCase();
        h += `<tr><td>${a.index}</td><td><span class="badge ${a.status}">${label}</span></td>`;
        h += `<td>${escapeHtml(a.description)}`;
        if (a.error) h += `<div class="note">${escapeHtml(a.error)}</div>`;
        h += `</td><td>${a.duration_ms !== undefined ? a.duration_ms + " ms" : ""}</td></tr>`;
      }
      h += `</tbody></table>`;
    }
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
